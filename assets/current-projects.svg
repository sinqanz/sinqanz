<text x="111" y="89" fill="#F1F4F7" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2">STUDIO</text>
<text x="58" y="386" fill="#FEFCF6" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Nudge</text>
<text x="58" y="443" fill="#D9DFE5" font-family="Arial,Helvetica,sans-serif" font-size="35">Independent browser tools.</text>
<path d="M58 508 H675" stroke="#607082" stroke-width="2"/>
<text x="58" y="564" fill="#F7D77A" font-family="Arial,Helvetica,sans-serif" font-size="27" letter-spacing=".8">Building with intention</text>
<path d="M634 566 l26 -26 m-22 0 h22 v22" fill="none" stroke="#F7D77A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
