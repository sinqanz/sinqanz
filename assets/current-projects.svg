<circle cx="615" cy="198" r="190" fill="none" stroke="#51657B" stroke-width="22" opacity=".47"/>
<circle cx="615" cy="198" r="120" fill="none" stroke="#7C8B9C" stroke-width="15" opacity=".35"/>
