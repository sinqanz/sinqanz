<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="ttl desc">
<title id="ttl">Current focus: Nudge Studio and Pocktab</title>
<desc id="desc">Two editorial cards featuring Nudge Studio as independent browser tools project, and Pocktab as a Chrome extension currently in development.</desc>
<defs>
  <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#273040"/><stop offset="1" stop-color="#36475B"/></linearGradient>
  <linearGradient id="sand" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FBF3E4"/><stop offset="1" stop-color="#F6E5C6"/></linearGradient>
</defs>
<rect width="1500" height="650" rx="35" fill="#F4F5F5"/>
<rect x="14" y="14" width="718" height="622" rx="30" fill="url(#navy)"/>
<rect x="767" y="14" width="719" height="622" rx="30" fill="url(#sand)"/>
