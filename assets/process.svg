<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="title desc">
<title id="title">The way I work</title><desc id="desc">Explore, build, refine. Small steps are how good work takes shape.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1cc"/><stop offset="1" stop-color="#ffe0a0"/></linearGradient></defs>
<rect width="840" height="440" rx="34" fill="url(#bg)"/>
<path d="M670 -85 C728 58 871 61 948 191" stroke="#eab75d" stroke-width="42" fill="none" opacity=".5"/>
<path d="M682 -65 C742 32 842 63 912 154" stroke="#fff9ed" stroke-width="22" fill="none" opacity=".82"/>
<rect x="48" y="48" width="236" height="55" rx="28" fill="#e3bb70"/>
<circle cx="75" cy="76" r="9" fill="#314658"/>
<text x="95" y="86" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="650" fill="#263443" letter-spacing="1">MY PROCESS</text>
<text x="48" y="175" font-family="Inter,Arial,sans-serif" font-size="57" font-weight="750" fill="#233346">Better over time.</text>
<text x="48" y="234" font-family="Inter,Arial,sans-serif" font-size="29" fill="#596574">No shortcuts. Just curiosity and practice.</text>
