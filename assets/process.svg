</g>
<g font-family="Inter,Arial,sans-serif" font-size="26" font-weight="650" fill="#283747" text-anchor="middle">
 <text x="109" y="373">Explore</text><text x="412" y="373">Build</text><text x="705" y="373">Refine</text>
