<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="280" viewBox="0 0 1500 280" role="img" aria-labelledby="ttl desc">
<title id="ttl">What I care about</title><desc id="desc">Useful ideas, considered details, and learning by doing.</desc>
<rect width="1500" height="280" fill="#FBFAF7" rx="30"/>
<path d="M499 47 V235 M1000 47 V235" stroke="#E7E4DD" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="68" y="99" font-size="28" font-weight="700" fill="#D65F3C">IDEAS</text>
 <text x="68" y="153" font-size="45" font-weight="600" fill="#26303E">Useful by nature.</text>
 <text x="68" y="207" font-size="24" fill="#69717A">Start with a real purpose.</text>
 <text x="558" y="99" font-size="28" font-weight="700" fill="#B78E30">DETAILS</text>
 <text x="558" y="153" font-size="45" font-weight="600" fill="#26303E">Made to feel right.</text>
 <text x="558" y="207" font-size="24" fill="#69717A">Thoughtful, not overbuilt.</text>
 <text x="1059" y="99" font-size="28" font-weight="700" fill="#506C7C">PROCESS</text>
 <text x="1059" y="153" font-size="45" font-weight="600" fill="#26303E">Keep learning.</text>
 <text x="1059" y="207" font-size="24" fill="#69717A">Explore. Build. Improve.</text>
</g>
</svg>